name: Fork Release

on:
  push:
    tags:
      - 'fork-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      # Root typecheck matches primary CI. Extension `tsc --noEmit` currently fails on
      # pre-existing test typing in extension/src/*test.ts; full `npm test` still
      # exercises unit + extension + adapter projects.
      - name: Type check (CLI)
        run: npm run typecheck

      - name: Run tests (unit + extension + adapter)
        run: npm test

      - name: Validate fork tag matches package version
        if: startsWith(github.ref, 'refs/tags/fork-v')
        run: |
          set -euo pipefail
          EXPECTED="fork-v$(node -p "require('./package.json').version")"
          ACTUAL="${GITHUB_REF_NAME}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::Tag ${ACTUAL} does not match package version (expected ${EXPECTED})"
            exit 1
          fi

      - name: Package fork artifacts
        run: ./scripts/package-fork.sh --output-dir artifacts

      - name: Fail on generated tracked-file drift
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- cli-manifest.json extension/dist; then
            echo "::error::Generated tracked files drifted after package (cli-manifest.json and/or extension/dist). Rebuild and commit before releasing."
            exit 1
          fi

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: opencli-fork-artifacts
          path: |
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/build-info.json
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/fork-v')
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/build-info.json
